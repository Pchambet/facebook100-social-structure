[project]
name = "fb100"
version = "1.0.0"
description = "Homophily, link prediction and communities in the Facebook100 campus networks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pierre Chambet", email = "pierrechambet@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
fb100 = "fb100.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fb100"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
